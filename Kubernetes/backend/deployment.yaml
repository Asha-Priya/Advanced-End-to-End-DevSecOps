apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 285861554470.dkr.ecr.ap-south-1.amazonaws.com/backend:1
        imagePullPolicy: Always
        ports:
        - containerPort: 3500
        env:
        - name: PORT
          value: "3500"
        - name: MONGO_CONN_STR
          value: "mongodb://admin:Admin@12345@mongodb:27017/three-tier?authSource=admin"
        - name: USE_DB_AUTH
          value: "true"
