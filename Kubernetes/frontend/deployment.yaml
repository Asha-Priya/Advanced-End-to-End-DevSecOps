apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 285861554470.dkr.ecr.ap-south-1.amazonaws.com/frontend:1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
